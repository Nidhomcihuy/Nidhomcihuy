<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="3" fill="#ff1f8e" opacity="0.35"/>
    </pattern>
    <radialGradient id="fade" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="1"/>
    </radialGradient>
    <g id="spider">
      <ellipse cx="250" cy="215" rx="26" ry="32"/>
      <ellipse cx="250" cy="275" rx="38" ry="58"/>
      <g fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M228 205 L170 150 L120 175"/>
        <path d="M224 230 L150 215 L95 250"/>
        <path d="M222 270 L150 290 L105 345"/>
        <path d="M232 305 L175 350 L150 410"/>
        <path d="M272 205 L330 150 L380 175"/>
        <path d="M276 230 L350 215 L405 250"/>
        <path d="M278 270 L350 290 L395 345"/>
        <path d="M268 305 L325 350 L350 410"/>
      </g>
    </g>
  </defs>

  <rect width="500" height="500" fill="#0a0a12"/>
  <rect width="500" height="500" fill="url(#dots)"/>
  <rect width="500" height="500" fill="url(#fade)"/>

  <!-- burst -->
  <polygon points="250,20 285,80 350,45 345,115 420,110 385,170 460,200 395,235 445,295 375,305 395,375 325,350 300,420 250,370 200,420 175,350 105,375 125,305 55,295 105,235 40,200 115,170 80,110 155,115 150,45 215,80" fill="#ffe600" stroke="#000" stroke-width="6"/>

  <!-- chromatic offset layers -->
  <g fill="#00e5ff" stroke="#00e5ff" transform="translate(-7,-4)"><use href="#spider"/></g>
  <g fill="#ff1f8e" stroke="#ff1f8e" transform="translate(7,4)"><use href="#spider"/></g>
  <g fill="#000" stroke="#000"><use href="#spider"/></g>

  <!-- hourglass mark -->
  <path d="M236 262 L264 262 L250 285 L264 308 L236 308 L250 285 Z" fill="#ff1f8e"/>

  <!-- text -->
  <text x="250" y="470" text-anchor="middle" font-family="Impact, 'Arial Black', sans-serif" font-size="46" fill="#ffe600" stroke="#000" stroke-width="3" paint-order="stroke" transform="rotate(-3 250 470)">THWIP!</text>
</svg>
